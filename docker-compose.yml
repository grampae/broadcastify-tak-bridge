services:
  broadcastify-tak-bridge:
    build: .
    container_name: broadcastify-tak-bridge
    restart: unless-stopped
    network_mode: host
    environment:
      BROADCASTIFY_STREAM_URL: ${BROADCASTIFY_STREAM_URL:-}
      BROADCASTIFY_USERNAME: ${BROADCASTIFY_USERNAME:-}
      BROADCASTIFY_PASSWORD: ${BROADCASTIFY_PASSWORD:-}
      TAK_HOST: ${TAK_HOST:-127.0.0.1}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      HF_HOME: /models
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./locations.yml:/app/locations.yml:ro
      - ./certs:/app/certs:ro
      - ./data:/app/data:ro
      - ./models:/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
